name: widyu
description: "위듀"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  carousel_slider: ^5.1.1
  go_router: ^16.2.0
  provider: ^6.1.5+1
  dio: ^5.9.0
  flutter_secure_storage: ^10.3.1
  flutter_dotenv: ^6.0.0
  step_progress: ^2.6.1
  daum_postcode_search: ^0.0.4
  flutter_inappwebview: ^6.1.5
  collection: ^1.19.1
  haptic_feedback: ^0.5.1+1
  fluttertoast: ^8.2.12
  flutter_native_splash: ^2.4.6
  table_calendar: ^3.2.0
  video_player: ^2.10.0
  intl: ^0.20.2
  photo_manager: ^3.7.1
  photo_manager_image_provider: ^2.2.0
  permission_handler: ^12.0.1
  percent_indicator: ^4.2.5
  get_phone_number: ^3.0.13
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.4
  pedometer: ^4.2.0
  shared_preferences: ^2.5.3
  flutter_background_service: ^5.1.0
  heart_rate:
    path: ./packages/heart_rate
  walk:
    path: ./packages/walk
  medication_alarm:
    path: ./packages/medication_alarm
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  stomp_dart_client: ^3.0.1
  rxdart: ^0.28.0
  skeletonizer: ^2.1.3
  package_info_plus: ^9.0.1
  image_picker: ^1.1.2
  camera: ^0.11.2+1
  url_launcher: ^6.3.1
  app_settings: ^7.0.0
  flutter_local_notifications: ^20.1.0
  cached_network_image: ^3.4.1
  health: 13.3.1
  workmanager: 0.10.10
  sqflite: ^2.4.2
  path: ^1.9.1
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_gen_runner: ^5.15.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
  assets:
    exclude:
      - .env

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
    - family: SCoreDream
      fonts:
        - asset: assets/fonts/SCDream6.otf
          weight: 600
    - family: KCCGanpan
      fonts:
        - asset: assets/fonts/KCC-Ganpan.otf
          weight: 400
