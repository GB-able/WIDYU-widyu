name: widyu
description: "위듀"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  carousel_slider: ^5.1.1
  go_router: ^16.2.0
  provider: ^6.1.5+1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.0
  step_progress: ^2.6.1
  daum_postcode_search: ^0.0.4
  flutter_inappwebview: ^6.1.5
  collection: ^1.19.1
  haptic_feedback: ^0.5.1+1
  fluttertoast: ^8.2.12
  flutter_native_splash: ^2.4.6
  table_calendar: ^3.2.0
  video_player: ^2.10.0
  intl: ^0.20.2
  photo_manager: ^3.7.1
  photo_manager_image_provider: ^2.2.0
  permission_handler: ^12.0.1
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
    - family: SCoreDream
      fonts:
        - asset: assets/fonts/SCDream6.otf
          weight: 600
