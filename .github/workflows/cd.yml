name: CD

# develop → main 병합 시 폰·워치 앱을 Play Console 내부 테스트 트랙에 배포한다.
# 비공개 테스트·프로덕션 승격은 Play Console 에서 수동으로 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false # 업로드 도중 취소되지 않게 한다.

jobs:
  deploy-android:
    # 수동 실행(workflow_dispatch)은 실행할 브랜치를 고를 수 있으므로 main 일 때만 배포한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Restore secret files
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          # CI(PR 검사)는 개발 서버용 DOT_ENV, 배포는 배포 서버용 DOT_ENV_RELEASE 를 쓴다.
          DOT_ENV_RELEASE: ${{ secrets.DOT_ENV_RELEASE }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$DOT_ENV_RELEASE" | base64 -d > .env
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          # 키가 비어 있으면 Gradle 이 debug 키로 서명하므로 여기서 멈춘다.
          test -s android/upload-keystore.jks

      - run: flutter pub get

      - name: Build app bundles
        run: |
          # 폰·워치에 같은 번호를 쓴다(워치 versionCode = 1_000_000 + 번호).
          # Play Console 에 수동으로 처음 올린 번들이 1 이므로 +1 한다.
          BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))
          flutter build appbundle --release --build-number=$BUILD_NUMBER
          (cd android && ./gradlew :wear:bundleRelease -PbuildNumber=$BUILD_NUMBER)

      - name: Upload phone bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.widucorp.widu
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      # Wear OS 번들은 전용 트랙(wear: 접두어)으로만 올릴 수 있다.
      - name: Upload wear bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.widucorp.widu
          releaseFiles: build/wear/outputs/bundle/release/wear-release.aab
          track: wear:internal
          status: completed
