name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# 각 검사 결과를 PR 체크와 결과 댓글에 표시한다.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter test
      - run: flutter test
        working-directory: packages/medication_alarm

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # PR에서도 다음 실행을 위해 캐시를 저장한다.
          cache-read-only: false
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter build apk --release

  report:
    name: Comment CI results
    needs: [lint, test, build-apk]
    # fork PR은 토큰에 쓰기 권한이 없으므로 저장소 내부 PR만 대상으로 한다.
    # 새 push로 취소된 실행은 댓글을 남기지 않는다.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const statuses = {
              success: '✅ 성공',
              failure: '❌ 실패',
              cancelled: '🚫 취소',
              skipped: '⏭️ 건너뜀',
              timed_out: '⏰ 시간 초과',
            };
            const rows = ['Lint', 'Test', 'Build APK'].map(name => {
              const job = jobs.find(job => job.name === name);
              const status = statuses[job?.conclusion] ?? job?.conclusion ?? '결과 없음';
              let duration = '-';
              if (job?.started_at && job?.completed_at && job.conclusion !== 'skipped') {
                const seconds = Math.max(0, Math.round(
                  (Date.parse(job.completed_at) - Date.parse(job.started_at)) / 1000,
                ));
                duration = `${Math.floor(seconds / 60)}분 ${seconds % 60}초`;
              }
              const label = job ? `[${name}](${job.html_url})` : name;
              return `| ${label} | ${status} | ${duration} |`;
            });
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${attempt}`;
            const marker = '<!-- ci-report -->';
            const body = [
              marker,
              '## CI 실행 결과',
              '',
              `커밋: ${context.payload.pull_request.head.sha.slice(0, 7)} · [실행 #${context.runNumber} (시도 ${attempt})](${runUrl})`,
              '',
              '| 단계 | 결과 | 소요 시간 |',
              '| --- | --- | --- |',
              ...rows,
              '',
              '소요 시간은 환경 준비를 포함한 각 작업의 실행 시간입니다.',
            ].join('\n');
            // PR당 댓글 하나를 유지하고 실행할 때마다 내용을 덮어쓴다.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
