name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# 각 검사 결과를 PR 체크와 결과 댓글에 표시한다.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter test
      - run: flutter test
        working-directory: packages/medication_alarm

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # PR에서도 다음 실행을 위해 캐시를 저장한다.
          cache-read-only: false
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter build apk --release

  report:
    name: Comment CI results
    needs: [lint, test, build-apk]
    # 기존 CI와 동일하게 저장소 내부 PR을 대상으로 한다.
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const statuses = {
              success: '✅ 성공',
              failure: '❌ 실패',
              cancelled: '🚫 취소',
              skipped: '⏭️ 건너뜀',
              timed_out: '⏰ 시간 초과',
            };
            const rows = ['Lint', 'Test', 'Build APK'].map(name => {
              const job = jobs.find(job => job.name === name);
              const status = statuses[job?.conclusion] ?? job?.conclusion ?? '결과 없음';
              let duration = '-';
              if (job?.started_at && job?.completed_at && job.conclusion !== 'skipped') {
                const seconds = Math.max(0, Math.round(
                  (Date.parse(job.completed_at) - Date.parse(job.started_at)) / 1000,
                ));
                duration = `${Math.floor(seconds / 60)}분 ${seconds % 60}초`;
              }
              const label = job ? `[${name}](${job.html_url})` : name;
              return `| ${label} | ${status} | ${duration} |`;
            });
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${attempt}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '## CI 실행 결과',
                '',
                `커밋: ${context.payload.pull_request.head.sha.slice(0, 7)} · [실행 #${context.runNumber} (시도 ${attempt})](${runUrl})`,
                '',
                '| 단계 | 결과 | 소요 시간 |',
                '| --- | --- | --- |',
                ...rows,
                '',
                '소요 시간은 환경 준비를 포함한 각 작업의 실행 시간입니다.',
              ].join('\n'),
            });
