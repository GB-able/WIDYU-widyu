name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# 항목별로 job을 나눠 PR 체크 목록에 성공 여부와 소요 시간이 따로 표시되게 한다.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter test
      - run: flutter test
        working-directory: packages/medication_alarm

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          dot-env: ${{ secrets.DOT_ENV }}
      - run: flutter build apk --release
