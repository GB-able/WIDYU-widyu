# 규칙 목록: https://dart.dev/lints
# 특정 줄이나 파일만 제외할 때는 `// ignore: 규칙명`, `// ignore_for_file: 규칙명`을 사용한다.
include: package:flutter_lints/flutter.yaml

analyzer:
  # 생성 코드는 검사하지 않는다.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gen.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Freezed 생성자 파라미터에 붙인 @JsonKey 경고 (Freezed 공식 권장 설정)
    invalid_annotation_target: ignore

linter:
  rules:
    # 버그 예방
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    # 스타일
    - always_declare_return_types
    - always_use_package_imports
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - unnecessary_await_in_return
    - avoid_redundant_argument_values
